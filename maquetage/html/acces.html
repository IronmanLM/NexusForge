<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexusForge — Accès</title>
<link rel="stylesheet" href="../css/commun.css?v=0.8.10">
<link rel="stylesheet" href="../css/acces.css?v=0.8.10">
</head>
<body>

  <section class="gauche" aria-label="NexusForge Accès">
    <a class="marque" href="accueil.html"><img src="../img/nexus_forge_symbol.svg" alt="" /><span>NexusForge</span></a>
    <div class="titre">
      <p class="sur-titre">Accès</p>
      <h1>Entrez dans le jeu.</h1>
    </div>
  </section>

  <section class="droite carrousel" data-fonds="../img/decor-abysses.jpg ../img/decor-cyber.jpg ../img/decor-phare.jpg ../img/decor-dryade.jpg ../img/decor-steam.jpg ../img/decor-vampires.jpg" data-delai="15000" aria-label="Connexion et inscription">
    <div class="fond" aria-hidden="true"></div>
    <div class="fond" aria-hidden="true"></div>
    <div class="colonne">
      <!-- Maquette statique : la connexion renvoie vers l’accueil en attendant la page « accueil connecté » (cf. TODO.md). -->
      <form class="rapide" action="accueil.html" method="get" aria-label="Connexion habituelle">
        <h2>Déjà des nôtres</h2>
        <label>Courriel <input type="email" name="email" autocomplete="email" placeholder="vous@exemple.fr" /></label>
        <label>Mot de passe <input type="password" name="motdepasse" autocomplete="current-password" placeholder="••••••••" /></label>
        <button type="submit">Se connecter</button>
      </form>
      <div class="rejoindre">
        <h2>Nous rejoindre</h2>
        <p>Première fois ? Nous t’accompagnons tout le long de ton périple.</p>
        <a class="cta" href="inscription.html">Commencer →</a>
        <p class="note">Parent d’un jeune joueur ? <a href="tuteurs.html">Espace parents →</a></p>
      </div>
    </div>
  </section>

<script src="../js/carrousel.js?v=0.8.10" defer></script>

</body>
</html>
